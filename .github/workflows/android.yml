name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Unit Tests & Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run static project checks
        run: python3 tools/check_project.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Probe live OpenCode gateway /v1/health
        run: |
          echo "Probing https://opencode-production-ef5d07d3.up.railway.app/v1/health ..."
          curl -sS -i --max-time 20 https://opencode-production-ef5d07d3.up.railway.app/v1/health || echo "Health probe failed or timed out"

      - name: Run JVM unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
          python3 tools/print_test_summary.py

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify signed APK integrity & metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT2" dump badging "$APK" | head -n 25

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexa-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
